<!doctype html>
<html lang="ko">
  <head>
    <script>
      // Immediate cleanup of stale ServiceWorker & caches to guarantee latest build
      if (typeof window !== 'undefined') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function() {});
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>크리스탈 오라클 (Crystal Orb)</title>
    
    <!-- Modern Clean Typography: Pretendard & Inter -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="application-name" content="크리스탈오라클" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="크리스탈오라클" />
    <meta name="theme-color" content="#030308" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest-orb.webmanifest" />

    <!-- Instant redirect to clean URL /orb if opened as /orb.html -->
    <script>
      (function() {
        if (window.location.pathname === '/orb.html') {
          try {
            window.history.replaceState(null, '', '/orb' + window.location.search);
          } catch(e) {}
        }
      })();
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        background-color: #030308;
        color: #fff;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-[#030308] text-white">
    <div id="root"></div>
    <script type="module" src="/src/orb-main.tsx"></script>
  </body>
</html>
