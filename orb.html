<!doctype html>
<html lang="ko">
  <head>
    <script>
      // 0-A. Third-Party Extension & MetaMask / Web3 Error Shield
      (function() {
        function isExtensionOrWalletError(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason?.message || err.reason || err || '');
          var stack = String(err.stack || err.reason?.stack || '');
          var filename = String(err.filename || '');
          var combined = msg + ' ' + stack + ' ' + filename;
          return /MetaMask|ethereum|web3|evmProvider|inpage\.js|contentscript|chrome-extension|moz-extension|safari-extension|Failed to connect to MetaMask|walletconnect|phantom/i.test(combined);
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionOrWalletError(event.reason || event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isExtensionOrWalletError(event.error || event.message || event)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
      })();

      // 0-B. Prevent "Cannot set property fetch of #<Window> which has only a getter" across all environments
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var assignedFetch = originalFetch;
            var fetchPropDesc = {
              get: function() {
                return assignedFetch;
              },
              set: function(val) {
                assignedFetch = val;
              },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', fetchPropDesc);
            } catch (e1) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', fetchPropDesc);
              } catch (e2) {}
            }
          }
        } catch (fetchErr) {
          console.warn("[FetchShield] Failed to patch fetch setter", fetchErr);
        }
      })();

      // 1. Safe Chunk Recovery Shield for Orb Standalone
      (function() {
        var recoveryKey = 'prism_orb_chunk_recovery_at';
        var recovering = false;

        function recoverFromStaleAssets() {
          if (recovering) return;
          var lastRecovery = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (Date.now() - lastRecovery < 30000) return;

          recovering = true;
          sessionStorage.setItem(recoveryKey, String(Date.now()));
          try {
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {});
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.update().catch(function() {}); }));
              }).catch(function() {});
            }
          } finally {
            window.location.reload();
          }
        }

        function isStaleAssetError(value) {
          var msg = String(value?.message || value?.reason?.message || value?.reason || value || '');
          return /ChunkLoadError|Loading chunk|Failed to fetch dynamically imported module|Importing a module script failed|preload/i.test(msg);
        }

        window.addEventListener('vite:preloadError', function(e) {
          e.preventDefault();
          recoverFromStaleAssets();
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (isStaleAssetError(e)) recoverFromStaleAssets();
        });
        window.addEventListener('error', function(e) {
          var failedScript = e.target instanceof HTMLScriptElement && e.target.src;
          if (failedScript || isStaleAssetError(e.error || e.message)) recoverFromStaleAssets();
        }, true);
      })();
    </script>

    <!-- Instant redirect to clean URL /orb if opened as /orb.html -->
    <script>
      (function() {
        if (window.location.pathname === '/orb.html') {
          try {
            window.history.replaceState(null, '', '/orb' + window.location.search);
          } catch(e) {}
        }
      })();
    </script>
