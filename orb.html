<!doctype html>
<html lang="ko">
  <head>
    <script>
      // 1. Instant Cache-Buster & Anti-Stale SW Purge
      (function() {
        var CURRENT_VERSION = '1.2.763';
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            }).catch(function() {});
          }
          var lastVer = localStorage.getItem('prism_orb_version_checkpoint');
          if (lastVer !== CURRENT_VERSION) {
            localStorage.setItem('prism_orb_version_checkpoint', CURRENT_VERSION);
            if (!location.search.includes('_t=')) {
              location.replace(location.pathname + '?_t=' + Date.now());
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>크리스탈 오브 (Crystal Orb)</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="application-name" content="크리스탈 오브" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="크리스탈 오브" />
    <meta name="theme-color" content="#030308" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/orb-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/orb-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/orb-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-orb.png" />
    <link rel="shortcut icon" href="/orb-favicon.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest-orb.webmanifest" />

    <!-- Instant redirect to clean URL /orb if opened as /orb.html -->
    <script>
      (function() {
        if (window.location.pathname === '/orb.html') {
          try {
            window.history.replaceState(null, '', '/orb' + window.location.search);
          } catch(e) {}
        }
      })();
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        background-color: #030308;
        color: #fff;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, Roboto, sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-[#030308] text-white">
    <div id="root"></div>
    <script type="module" src="/src/orb-main.tsx"></script>
  </body>
</html>
