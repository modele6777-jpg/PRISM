<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="bgCosmic" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E0E3E" />
      <stop offset="55%" stop-color="#0E051D" />
      <stop offset="100%" stop-color="#05020B" />
    </radialGradient>

    <!-- Rainbow Prism Border Gradient -->
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="18%" stop-color="#F97316" />
      <stop offset="36%" stop-color="#FBBF24" />
      <stop offset="54%" stop-color="#10B981" />
      <stop offset="72%" stop-color="#3B82F6" />
      <stop offset="90%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Book Gold Page Gradient -->
    <linearGradient id="goldPages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0D24" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgCosmic)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#rainbowBorder)" stroke-width="5" opacity="0.9" />

  <!-- Ambient Radiant Nebulae -->
  <circle cx="256" cy="230" r="160" fill="#8B5CF6" opacity="0.18" filter="url(#celestialGlow)" />
  <circle cx="256" cy="230" r="110" fill="#F59E0B" opacity="0.15" filter="url(#celestialGlow)" />

  <!-- Celestial Orbit Dashed Ring -->
  <circle cx="256" cy="230" r="175" fill="none" stroke="url(#rainbowBorder)" stroke-width="2" stroke-dasharray="8 12" opacity="0.45" />

  <!-- 7 Rainbow Sanctuary Orbs orbiting around -->
  <circle cx="256" cy="55" r="7.5" fill="#EF4444" filter="url(#celestialGlow)" />
  <circle cx="385" cy="115" r="7.5" fill="#F97316" filter="url(#celestialGlow)" />
  <circle cx="430" cy="230" r="7.5" fill="#FBBF24" filter="url(#celestialGlow)" />
  <circle cx="365" cy="365" r="7.5" fill="#10B981" filter="url(#celestialGlow)" />
  <circle cx="147" cy="365" r="7.5" fill="#3B82F6" filter="url(#celestialGlow)" />
  <circle cx="82" cy="230" r="7.5" fill="#6366F1" filter="url(#celestialGlow)" />
  <circle cx="127" cy="115" r="7.5" fill="#A855F7" filter="url(#celestialGlow)" />

  <!-- The Master Luminous Codex / Sacred Book (ReBible) -->
  <g filter="url(#dropShadow)">
    <!-- Book Back Cover / Base -->
    <path d="M 120 325 
             C 180 305, 240 320, 256 330 
             C 272 320, 332 305, 392 325 
             L 396 337 
             C 336 317, 272 332, 256 342 
             C 240 332, 176 317, 116 337 Z" 
          fill="#1E1B4B" stroke="#818CF8" stroke-width="3" />

    <!-- Left Open Pages Stack -->
    <path d="M 120 175 
             C 175 155, 235 170, 256 190 
             L 256 330 
             C 235 310, 175 295, 120 315 Z" 
          fill="url(#goldPages)" />

    <!-- Right Open Pages Stack -->
    <path d="M 392 175 
             C 337 155, 277 170, 256 190 
             L 256 330 
             C 277 310, 337 295, 392 315 Z" 
          fill="url(#goldPages)" />

    <!-- Book Spine Glow Centerline -->
    <path d="M 256 190 L 256 330" stroke="#D97706" stroke-width="4" stroke-linecap="round" />

    <!-- Sacred Page Text Lines (Left Page) -->
    <line x1="145" y1="205" x2="235" y2="215" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="145" y1="225" x2="235" y2="235" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="145" y1="245" x2="235" y2="255" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="145" y1="265" x2="215" y2="273" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Sacred Page Text Lines (Right Page) -->
    <line x1="277" y1="215" x2="367" y2="205" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="277" y1="235" x2="367" y2="225" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="277" y1="255" x2="367" y2="245" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="297" y1="273" x2="367" y2="265" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Golden Bookmark Ribbon Hanging Below -->
    <path d="M 256 330 L 256 385 L 265 376 L 274 385 L 274 333 Z" fill="#EF4444" filter="url(#celestialGlow)" />
  </g>

  <!-- Glowing Radiant 8-Point Wisdom Star (Rising from the Codex) -->
  <g filter="url(#celestialGlow)">
    <path d="M 256 85 
             C 256 122, 275 142, 312 142 
             C 275 142, 256 162, 256 199 
             C 256 162, 237 142, 200 142 
             C 237 142, 256 122, 256 85 Z" 
          fill="url(#starGold)" />
    <!-- Center Sparkle -->
    <circle cx="256" cy="142" r="7" fill="#FFFFFF" />
  </g>

  <!-- Bottom Typography Badge (ReBible) -->
  <g transform="translate(0, 430)">
    <text x="256" y="0" text-anchor="middle" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="8" opacity="0.95">REBIBLE</text>
    <text x="256" y="24" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="4" opacity="0.85">WISDOM CODEX</text>
  </g>
</svg>
