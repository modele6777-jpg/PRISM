<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Star Golden Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#D97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Ambient Golden Halo -->
  <circle cx="256" cy="235" r="160" fill="#F59E0B" opacity="0.12" filter="url(#goldGlow)" />
  
  <!-- Outer Dotted Orbit -->
  <circle cx="256" cy="235" r="145" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="10 14" opacity="0.3" />

  <!-- Center 8-Point Celestial Star (Lucy Emblem) -->
  <g filter="url(#subtleShadow)">
    <!-- 8-Pointed Star Shape -->
    <path d="M 256 95 
             C 256 185, 290 235, 396 235 
             C 290 235, 256 285, 256 375 
             C 256 285, 222 235, 116 235 
             C 222 235, 256 185, 256 95 Z" 
          fill="url(#starGrad)" />
          
    <!-- Diagonal Sparkle Rays -->
    <path d="M 256 160 
             C 256 215, 275 235, 331 235 
             C 275 235, 256 255, 256 310 
             C 256 255, 237 235, 181 235 
             C 237 235, 256 215, 256 160 Z" 
          fill="#FFFBEB" opacity="0.75" />

    <!-- Center Radiant Core -->
    <circle cx="256" cy="235" r="22" fill="#FFFFFF" filter="url(#goldGlow)" />
    <circle cx="256" cy="235" r="12" fill="#FDE047" />
  </g>

  <!-- Accent Sparkles -->
  <g fill="#F59E0B" opacity="0.8">
    <path d="M 370 130 Q 370 145 385 145 Q 370 145 370 160 Q 370 145 355 145 Q 370 145 370 130 Z" fill="#F59E0B" />
    <path d="M 140 310 Q 140 322 152 322 Q 140 322 140 334 Q 140 322 128 322 Q 140 322 140 310 Z" fill="#F59E0B" />
  </g>

  <!-- PRO Pill Badge -->
  <g transform="translate(196, 395)">
    <rect width="120" height="42" rx="21" fill="#1E293B" />
    <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="2.5">PRO</text>
  </g>
</svg>
