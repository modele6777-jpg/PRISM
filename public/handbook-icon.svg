<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgCosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E051D" />
      <stop offset="50%" stop-color="#1A0A33" />
      <stop offset="100%" stop-color="#080214" />
    </linearGradient>

    <!-- Rainbow Prism Border Gradient -->
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="20%" stop-color="#F97316" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Book Gold Page Gradient -->
    <linearGradient id="goldPages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Book Cover Deep Indigo Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0D24" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#A855F7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgCosmic)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#rainbowBorder)" stroke-width="6" opacity="0.9" />

  <!-- Ambient Radiant Nebulae -->
  <circle cx="256" cy="240" r="160" fill="#A855F7" opacity="0.18" filter="url(#celestialGlow)" />
  <circle cx="256" cy="240" r="110" fill="#F59E0B" opacity="0.15" filter="url(#celestialGlow)" />

  <!-- Celestial Orbit Dashed Ring -->
  <circle cx="256" cy="240" r="185" fill="none" stroke="url(#rainbowBorder)" stroke-width="2" stroke-dasharray="10 14" opacity="0.4" />

  <!-- 7 Rainbow Sanctuary Orbs orbiting around -->
  <circle cx="256" cy="55" r="7" fill="#EF4444" filter="url(#celestialGlow)" />
  <circle cx="395" cy="115" r="7" fill="#F97316" filter="url(#celestialGlow)" />
  <circle cx="435" cy="256" r="7" fill="#FBBF24" filter="url(#celestialGlow)" />
  <circle cx="370" cy="395" r="7" fill="#10B981" filter="url(#celestialGlow)" />
  <circle cx="142" cy="395" r="7" fill="#3B82F6" filter="url(#celestialGlow)" />
  <circle cx="77" cy="256" r="7" fill="#6366F1" filter="url(#celestialGlow)" />
  <circle cx="117" cy="115" r="7" fill="#A855F7" filter="url(#celestialGlow)" />

  <!-- The Master Luminous Codex / Sacred Book -->
  <g filter="url(#dropShadow)">
    <!-- Book Back Cover / Base -->
    <path d="M 120 340 
             C 180 320, 240 335, 256 345 
             C 272 335, 332 320, 392 340 
             L 396 352 
             C 336 332, 272 347, 256 357 
             C 240 347, 176 332, 116 352 Z" 
          fill="#1E1B4B" stroke="#6366F1" stroke-width="3" />

    <!-- Left Open Pages Stack -->
    <path d="M 120 180 
             C 175 160, 235 175, 256 195 
             L 256 345 
             C 235 325, 175 310, 120 330 Z" 
          fill="url(#goldPages)" />

    <!-- Right Open Pages Stack -->
    <path d="M 392 180 
             C 337 160, 277 175, 256 195 
             L 256 345 
             C 277 325, 337 310, 392 330 Z" 
          fill="url(#goldPages)" />

    <!-- Book Spine Glow Centerline -->
    <path d="M 256 195 L 256 345" stroke="#D97706" stroke-width="4" stroke-linecap="round" />

    <!-- Sacred Page Text Lines (Left Page) -->
    <line x1="145" y1="215" x2="235" y2="225" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="235" x2="235" y2="245" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="255" x2="235" y2="265" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="145" y1="275" x2="215" y2="283" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Sacred Page Text Lines (Right Page) -->
    <line x1="277" y1="225" x2="367" y2="215" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="245" x2="367" y2="235" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="277" y1="265" x2="367" y2="255" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="297" y1="283" x2="367" y2="275" stroke="#92400E" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Golden Bookmark Ribbon Hanging Below -->
    <path d="M 256 345 L 256 405 L 265 395 L 274 405 L 274 348 Z" fill="#EF4444" filter="url(#celestialGlow)" />
  </g>

  <!-- Glowing Radiant 8-Point Wisdom Star (Rising from the Codex) -->
  <g filter="url(#celestialGlow)">
    <path d="M 256 90 
             C 256 130, 275 150, 315 150 
             C 275 150, 256 170, 256 210 
             C 256 170, 237 150, 197 150 
             C 237 150, 256 130, 256 90 Z" 
          fill="url(#starGold)" />
    <!-- Center Sparkle -->
    <circle cx="256" cy="150" r="8" fill="#FFFFFF" />
  </g>

  <!-- Bottom Typography Badge -->
  <text x="256" y="445" text-anchor="middle" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="8" opacity="0.95">PRISM BIBLE</text>
  <text x="256" y="470" text-anchor="middle" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="4" opacity="0.8">7 SANCTUARIES CODEX</text>
</svg>